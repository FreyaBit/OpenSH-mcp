[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shanghai-library-open-data-mcp"
version = "1.3.0"
description = "上海图书馆开放数据 MCP 服务：纪年/家谱/建筑/红色事件/古籍/书目/诗词等开放数据的 Model Context Protocol 服务（stdio + Streamable HTTP，纯标准库零依赖）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FreyaWu" }]
keywords = ["mcp", "model-context-protocol", "上海图书馆", "library", "open-data", "古籍", "纪年", "诗词"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FreyaBit/OpenSH-mcp"
Repository = "https://github.com/FreyaBit/OpenSH-mcp"

[project.scripts]
shanghai-library-open-data-mcp = "slc_mcp_server:cli"

[tool.hatch.build.targets.wheel]
py-modules = ["slc_mcp_server", "slc_mcp_http", "slc_endpoints"]
